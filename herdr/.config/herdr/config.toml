onboarding = false

[theme]
name = "terminal"

auto_switch = false

[theme.custom]
subtext0 = "#a9b1d6"
overlay0 = "#565f89"
mauve = "#bb9af7"
active_row_bg = "#232636"

[terminal]

[update]

[keys]
prefix = "ctrl+space"
new_tab = "prefix+n"
previous_tab = "ctrl+shift+h"
next_tab = "ctrl+shift+l"
previous_workspace = "ctrl+shift+k"
next_workspace = "ctrl+shift+j"
previous_agent = "alt+shift+h"
next_agent = "alt+shift+l"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_left = "h"
navigate_pane_right = "l"

move_tab_next = "alt+shift+right"
move_tab_previous = "alt+shift+left"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

[server]

[ui]
pane_gaps = true
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"

tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "herdr workspace list | jq -r '.result.workspaces[] | select(.focused) | .label'", interval_seconds = 1 },
]

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]

[ui.sound]

enabled = true
[session]

[remote]

[experimental]
# pane_history = false

[advanced]

# >>> furkankly.zoetrope keys (managed: `setup-keys` writes this block, `remove-keys` deletes it)
[[keys.command]]
key = "prefix+shift+z"
type = "plugin_action"
command = "furkankly.zoetrope.open"
description = "zoetrope: session graph (overlay)"

# The graph opens over the focused pane and gives the layout back when
# it closes. The same key closes it. Two other placements, if you would
# rather keep the graph on screen: uncomment one, or point the binding
# above at its action. Then: herdr server reload-config
