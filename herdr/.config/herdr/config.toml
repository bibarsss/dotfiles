onboarding = false

[theme]
name = "tokyo-night"

[terminal]

[update]

[keys]
prefix = "ctrl+space"
new_tab = "prefix+n"
previous_tab = "ctrl+shift+h"
next_tab = "ctrl+shift+l"
previous_workspace = "ctrl+shift+k"
next_workspace = "ctrl+shift+j"
previous_agent = "alt+shift+h"
next_agent = "alt+shift+l"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_left = "h"
navigate_pane_right = "l"

move_tab_next = "alt+shift+right"
move_tab_previous = "alt+shift+left"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[server]

[ui]
pane_gaps = true
show_agent_labels_on_pane_borders = true

status_indicators = "symbols"
[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]

[ui.sound]

enabled = true
[session]

[remote]

[experimental]
# pane_history = false

[advanced]
