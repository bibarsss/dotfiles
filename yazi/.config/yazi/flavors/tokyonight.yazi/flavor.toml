# vim:fileencoding=utf-8:foldmethod=marker
#:schema https://yazi-rs.github.io/schemas/theme.json

# : App {{{

[app]
overall = {}

# : }}}


# : Manager {{{

[mgr]
cwd = { fg = "#7aa2f7" }

# Find
find_keyword = { fg = "#f7768e", bold = true, italic = true, underline = true }
find_position = { fg = "#bb9af7", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { italic = true }

# Marker
marker_copied = { fg = "#9ece6a", bg = "#9ece6a" }
marker_cut = { fg = "#e0af68", bg = "#f7768e" }
marker_marked = { fg = "#7aa2f7", bg = "#7dcfff" }
marker_selected = { fg = "#e0af68", bg = "#e0af68" }
marker_symbol = "│"

# Count
count_copied = { fg = "#1a1b26", bg = "#9ece6a" }
count_cut = { fg = "#1a1b26", bg = "#e0af68" }
count_selected = { fg = "#1a1b26", bg = "#7aa2f7" }

# Border
border_symbol = "│"
border_style = { fg = "#afd7ff" }

# Highlighting
syntect_theme = ""

# : }}}


# : Tabs {{{

[tabs]
active = { fg = "#292e42", bg = "#7aa2f7", bold = true }
inactive = { fg = "#7aa2f7", bg = "#292e42" }

# Separator
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }
# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#292e42", bg = "#7aa2f7", bold = true }
normal_alt = { fg = "#7aa2f7", bg = "#292e42" }

# Select mode
select_main = { fg = "#292e42", bg = "#9ece6a", bold = true }
select_alt = { fg = "#7aa2f7", bg = "#292e42" }

# Unset mode
unset_main = { fg = "#292e42", bg = "#bb9af7", bold = true }
unset_alt = { fg = "#7aa2f7", bg = "#292e42" }

# : }}}

# : Indicator of hovered file {{{

[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

# : }}}


# : Status bar {{{

[status]
overall = { fg = "#7aa2f7" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep = { fg = "#7aa2f7" }
perm_type = { fg = "#9ece6a" }
perm_read = { fg = "#e0af68" }
perm_write = { fg = "#f7768e" }
perm_exec = { fg = "#bb9af7" }

# Progress
progress_label = { fg = "#292e42", bold = true }
progress_normal = { fg = "#7aa2f7", bg = "#292e42" }
progress_error = { fg = "#f7768e", bg = "#292e42" }

# : }}}


# : Pick {{{

[pick]
border = { fg = "#7aa2f7" }
active = { fg = "#bb9af7", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border = { fg = "#7aa2f7" }
title = {}
value = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#7aa2f7" }
active = { reversed = true }
inactive = {}
icon_file = ""
icon_folder = ""
icon_command = ""

# : }}}


# : Tasks {{{

[tasks]
border = { fg = "#7aa2f7" }
title = {}
hovered = { fg = "#bb9af7", underline = true }

# : }}}


# : Which {{{

[which]
border = { fg = "#7aa2f7" }
cols = 3
mask = { bg = "#414868" }
cand = { fg = "#9ece6a" }
rest = { fg = "#a9b1d6" }
desc = { fg = "#bb9af7" }
separator = "  "
separator_style = { fg = "#626880" }

# : }}}


# : Confirmation {{{

[confirm]
border = { fg = "#7aa2f7" }
title = { fg = "#7aa2f7" }
body = {}
list = {}
btn_yes = { reversed = true }
btn_no = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

# : }}}


# : Spotter {{{

[spot]
border = { fg = "#7aa2f7" }
title = { fg = "#7aa2f7" }
tbl_col = { fg = "#9ece6a" }
tbl_cell = { fg = "#e0af68", reversed = true }

# : }}}


# : Help {{{

[help]
border = { fg = "#7aa2f7" }
chord = { fg = "#9ece6a" }
action = { fg = "#bb9af7" }
hovered = { reversed = true, bold = true }

# : }}}


# : Notify {{{

[notify]
title_info = { fg = "#9ece6a" }
title_warn = { fg = "#f7768e" }
title_error = { fg = "#e0af68" }
icon_info = ""
icon_warn = ""
icon_error = ""

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
    # Images
    { mime = "**/image/*", fg = "#e0af68" },
    # Media
    { mime = "**/{audio,video}/*", fg = "#f7768e" },
    # Archives
    { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#bb9af7" },
    # Documents
    { mime = "**/application/{pdf,doc,rtf}", fg = "#9ece6a" },
    # Virtual file system
    { mime = "vfs/{absent,stale}", fg = "darkgray" },
    # Special file
    { url = "*", is = "orphan", bg = "#f7768e" },
    { url = "*", is = "exec", fg = "#9ece6a" },
    # Dummy file
    { url = "*", is = "dummy", bg = "#f7768e" },
    { url = "*/", is = "dummy", bg = "#f7768e" },
    # Fallback
    { url = "*", fg = "#c6d0f5" },
    { url = "*/", fg = "#7aa2f7" },
]

# : }}}

# : Icons {{{

[icon]
conds = [
    # Special files
    { if = "orphan", text = "", fg = "#f7768e" },
    { if = "link", text = "", fg = "#565f89" },
    { if = "block", text = "", fg = "#e0af68" },
    { if = "char", text = "", fg = "#e0af68" },
    { if = "fifo", text = "", fg = "#e0af68" },
    { if = "sock", text = "", fg = "#e0af68" },
    { if = "sticky", text = "", fg = "#e0af68" },
    { if = "dummy", text = "", fg = "#f7768e" },

    # Fallback
    { if = "dir & hovered", text = "", fg = "#7aa2f7" },
    { if = "dir", text = "", fg = "#7aa2f7" },
    { if = "exec", text = "", fg = "#9ece6a" },
    { if = "!dir", text = "", fg = "#c6d0f5" },
]

# : }}}
